# ============================================================================
# PROJECT METADATA (PEP 621)
# ============================================================================

[project]
name = "stardex-backend"
version = "0.1.0"
description = "Backend service for GitHub Stars Explorer"
readme = "README.md"
authors = [{ name = "Bjorn Melin" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
]

# ============================================================================
# BUILD SYSTEM
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# DEVELOPMENT DEPENDENCIES (PEP 735)
# ============================================================================

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
]
lint = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

# ============================================================================
# UV CONFIGURATION
# ============================================================================

[tool.uv]
default-groups = ["dev", "lint"]
package = false

# ============================================================================
# RUFF CONFIGURATION
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
src = ["app", "tests"]
exclude = [
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (handled by ruff format)
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "D206",   # indent-with-spaces
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "COM812", # missing-trailing-comma (conflicts with formatter)
    "COM819", # prohibited-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    "ISC002", # multi-line-implicit-string-concatenation
    # Docstring style conflicts (D211 vs D203, D212 vs D213)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    # Too strict for this project
    "D100",   # undocumented-public-module
    "D104",   # undocumented-public-package
    "D107",   # undocumented-public-init
    "ANN401", # dynamically-typed-expressions (Any)
    # Common patterns
    "FBT001", # boolean-positional-arg-in-function-definition
    "FBT002", # boolean-default-value-in-function-definition
    "PLR0913", # too-many-arguments
    "PLR2004", # magic-value-comparison
    # Allow TODO comments
    "FIX002", # line-contains-todo
    "TD002",  # missing-todo-author
    "TD003",  # missing-todo-link
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
    "PLR2004", # magic-value-comparison
    "ARG001",  # unused-function-argument (fixtures)
    "ARG002",  # unused-method-argument
]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

# ============================================================================
# PYRIGHT CONFIGURATION
# ============================================================================

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
venvPath = "."
venv = ".venv"

# Elevate important checks
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnusedImport = "error"
reportDuplicateImport = "error"

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
